[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/armory_hardware", "src/armory_tui"]

[project]
name = "armory-hardware"
version = "0.1.0"
description = "Hardware-specific fleet control and operator TUI for Armory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.21",
    "imageio-ffmpeg>=0.6.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
    "tyro>=1.0.12",
]

[project.optional-dependencies]
trial = [
    "imageio-ffmpeg",
    "requests",
    "tqdm",
    "tyro",
]

[project.scripts]
armory-tui = "armory_tui.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
