# Fleet layout for armory-tui (see FleetConfig).
#
# Operator-specific values -- SSH account, address range, jump host, camera server --
# are NOT stored here. They come from .env (copy .env.example) or the environment.
# Adding an ssh/tunnel/webcam key below overrides the environment for that value.

logging:
  # Per-workstation and system file logs (workstation_*.log, armory_system.log).
  # Relative paths are resolved from the repo root when this file lives under
  # configs/. Use an absolute path to write logs elsewhere.
  log_dir: logs/tui

workstations:
  - id: 1
  - id: 2
  - id: 3
  - id: 4
  - id: 5
  - id: 6
  - id: 7
  - id: 8
  - id: 9
  - id: 10
  - id: 11
  - id: 12
  - id: 13
  - id: 14
