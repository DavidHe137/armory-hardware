# Homogeneous 14-robot lego-sorting trial, long execution horizon.
#
# Same shape as het_lego_sort_homog.yaml but every station in the fleet and
# max_execution_horizon 100 (vs 10). Longer chunks mean each robot executes
# more actions per inference, so it asks the server for work less often --
# the lever against the planner starvation the 10-robot run showed.
#
# Still needed even though the run is homogeneous: run_real's top-level
# --control-hz / --max-execution-horizon are provenance-only, and there is no
# --min-execution-horizon or --prompt flag at all. The het config is the only
# channel that reaches the clients.
#
#   control_hz          -> --control-hz 30
#   min/max horizon     -> --min-execution-horizon 5 / --max-execution-horizon 100
#   language_index 0    -> --prompt "sort the red and blue legos into the correct bins"
#                          (resolved via configs/real_task_index.json)

control_hz:
  1: 30
  2: 30
  3: 30
  4: 30
  5: 30
  6: 30
  7: 30
  8: 30
  9: 30
  10: 30
  11: 30
  12: 30
  13: 30
  14: 30

min_execution_horizon:
