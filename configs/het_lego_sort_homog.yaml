# Homogeneous 10-robot lego-sorting trial.
#
# Every station gets identical settings. This file exists because run_real.py's
# top-level --control-hz / --max-execution-horizon are provenance-only: the het
# config is the only channel that actually forwards launch args to the clients.
#
#   control_hz          -> --control-hz 30
#   min/max horizon     -> --min-execution-horizon 5 / --max-execution-horizon 10
#   language_index 0    -> --prompt "sort the red and blue legos into the correct bins"
#                          (resolved via configs/real_task_index.json)

control_hz:
  1: 30
  4: 30
  5: 30
  6: 30
  7: 30
  8: 30
  11: 30
  12: 30
  13: 30
  14: 30

min_execution_horizon:
  1: 5
  4: 5
  5: 5
  6: 5
  7: 5
  8: 5
  11: 5
  12: 5
  13: 5
  14: 5

max_execution_horizon:
  1: 10
  4: 10
  5: 10
  6: 10
  7: 10
  8: 10
  11: 10
  12: 10
  13: 10
  14: 10

language_index:
  1: 0
  4: 0
  5: 0
  6: 0
  7: 0
  8: 0
  11: 0
  12: 0
  13: 0
  14: 0
